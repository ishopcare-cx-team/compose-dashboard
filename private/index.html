<!doctype html>
<html lang="ko">
<head>

<title>컴포즈 통합 대시보드</title>
<style>
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f5f2ec; color:#1d1d1f;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  .card{background:#fff; border-radius:16px; padding:32px 36px; max-width:420px; box-shadow:0 2px 12px rgba(0,0,0,.06); text-align:center}
  .eyebrow{display:inline-block; background:#ffd60a; font-weight:800; font-size:12px; letter-spacing:.08em; padding:4px 10px; border-radius:6px}
  h1{font-size:20px; margin:14px 0 8px}
  p{margin:0; color:#6e6e73; line-height:1.6; font-size:14px}
</style>

<body>
<!-- 2026-11-16: github.io 공유 화면은 닫았습니다. 밖에서 보는 화면은 Apps Script 주소 + 비밀번호로만(tools/publish-site.sh가 이 파일을 올림) -->
<div class="card">
  <span class="eyebrow">COMPOSE</span>
  <h1>대시보드 주소가 바뀌었습니다</h1>
  <p>이 주소는 더 이상 쓰지 않아요.<br>담당자에게 받은 새 주소로 접속해 주세요.</p>
</div>
