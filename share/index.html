<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컴포즈 통합 대시보드</title>
<meta name="description" content="컴포즈커피 매장 지원 통합 현황 · CX 상담 + 원격 처리 · 공유용">
<meta property="og:type" content="website">
<meta property="og:title" content="컴포즈 통합 대시보드">
<meta property="og:description" content="컴포즈커피 매장 지원 통합 현황 · CX 상담 + 원격 처리 · 공유용">
<meta property="og:url" content="https://ishopcare-cx-team.github.io/compose-dashboard/share/">
<meta property="og:image" content="https://ishopcare-cx-team.github.io/compose-dashboard/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" type="image/png" href="../favicon-64.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 배치는 CX 리포트(Compose.html: 제목 · 가로 탭 · 조회 바), 색과 글꼴은 원격팀 대시보드(client.html)를 따릅니다.
     컴포즈 옐로우(--yellow)는 선택된 탭과 상단 표식에만 씁니다. 노란 바탕에는 진한 글자를 씁니다(대비 확보). */
  :root{
    --ink:#1d1d1f; --ink-soft:#424245; --gray:#6e6e73; --gray2:#86868b;
    --line:#d2d2d7; --line-soft:#e8e8ed; --surface:#f5f5f7; --surface2:#fafafa; --canvas:#ffffff;
    --yellow:#ffd400; --yellow-ink:#1d1d1f;
    --accent:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f1fd; --accent-deep:#0060c0; --accent-line:#0071e3;
    --bar:#2a78d6;
    --red:#d70015; --red-soft:#ffecec; --green:#248a3d; --green-soft:#e7f8ec;
    --orange:#c93400; --orange-soft:#fff0e5; --purple:#5e5ce6; --purple-soft:#efeefe; --muted:#aeaeb4;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05); --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      --ink:#f2f2f7; --ink-soft:#c9c9ce; --gray:#a0a0a6; --gray2:#8a8a90;
      --line:#3a3a3f; --line-soft:#2a2a2e; --surface:#17171a; --surface2:#202024; --canvas:#242429;
      --accent:#0a84ff; --accent-soft:rgba(10,132,255,.22); --accent-deep:#5aa9ff; --accent-line:#0a84ff; --bar:#6da7ec;
      --red:#ff6961; --red-soft:rgba(255,69,58,.20); --green:#30d158; --green-soft:rgba(48,209,88,.20);
      --orange:#ff9f0a; --orange-soft:rgba(255,159,10,.18); --purple:#8b88ff; --purple-soft:rgba(139,136,255,.2); --muted:#7a7a80;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70;
      --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.55); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f2f2f7; --ink-soft:#c9c9ce; --gray:#a0a0a6; --gray2:#8a8a90;
    --line:#3a3a3f; --line-soft:#2a2a2e; --surface:#17171a; --surface2:#202024; --canvas:#242429;
    --accent:#0a84ff; --accent-soft:rgba(10,132,255,.22); --accent-deep:#5aa9ff; --accent-line:#0a84ff; --bar:#6da7ec;
    --red:#ff6961; --red-soft:rgba(255,69,58,.20); --green:#30d158; --green-soft:rgba(48,209,88,.20);
    --orange:#ff9f0a; --orange-soft:rgba(255,159,10,.18); --purple:#8b88ff; --purple-soft:rgba(139,136,255,.2); --muted:#7a7a80;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.55); color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","맑은 고딕","Segoe UI",Roboto,sans-serif;
    background:var(--surface); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.45; min-height:100vh}

  /* CX 리포트 배치: 가운데 페이지 · 제목 줄 · 폴더 모양 가로 탭 · 조회 바 */
  .page{flex:1; min-width:0; max-width:1320px; margin:0 auto; padding:28px 28px 60px}
  /* 메뉴가 열려 있으면 메뉴에 COMPOSE 표식이 있으므로 본문 위 표식은 숨깁니다(넓은 화면). */
  @media (min-width:821px){ body:not(.side-off) .top .eyebrow{display:none} }
  .top{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:16px; flex-wrap:wrap}
  .eyebrow{display:inline-block; background:var(--yellow); color:var(--yellow-ink); border-radius:6px; padding:5px 8px; font-size:12px; font-weight:800; letter-spacing:.08em; margin-bottom:9px}
  .title-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .title{font-size:28px; font-weight:800; letter-spacing:-.04em}
  .data-badge{font-size:12px; font-weight:700; background:var(--canvas); border:1px solid var(--line); color:var(--gray); padding:3px 10px; border-radius:20px}
  .top-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .updated{font-size:12px; color:var(--gray2); white-space:nowrap}
  /* 왼쪽 카테고리 메뉴: ☰로 메뉴 전체를, 묶음 제목으로 묶음을 열고 닫습니다. 선택된 항목만 컴포즈 옐로우. */
  .shell{display:flex; min-height:100vh}
  .side{flex:0 0 228px; width:228px; background:var(--canvas); border-right:1px solid var(--line-soft); position:sticky; top:0; height:100vh; overflow-y:auto;
    padding:22px 12px; transition:margin-left .2s ease}
  body.side-off .side{margin-left:-229px}
  .side-brand{display:flex; align-items:center; gap:8px; padding:2px 4px 18px 10px; font-size:13.5px; font-weight:800; letter-spacing:-.01em; white-space:nowrap}
  .side-brand .eyebrow{margin:0}
  .grp{display:flex; align-items:center; width:100%; border:none; background:none; padding:9px 10px 6px; font-family:inherit; font-size:11.5px; font-weight:800;
    letter-spacing:.06em; color:var(--gray2); cursor:pointer}
  .grp::after{content:"▾"; margin-left:auto; font-size:12px; transition:transform .15s}
  .grp.closed::after{transform:rotate(-90deg)}
  .grp.closed + .grp-body{display:none}
  .grp-body{display:flex; flex-direction:column; gap:2px; margin-bottom:10px}
  .view-tab{display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; border-radius:10px; background:none; color:var(--ink-soft); padding:10px 12px;
    font-family:inherit; font-size:14.5px; font-weight:600; line-height:1.35; cursor:pointer}
  .view-tab:hover{background:var(--surface)}
  .view-tab.active{background:var(--yellow); color:var(--yellow-ink); font-weight:800}
  .view-tab .src{margin-left:auto; font-size:10.5px; font-weight:700; color:var(--gray2)}
  .view-tab.active .src{color:rgba(0,0,0,.55)}
  .side-toggle{width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:10px; background:var(--canvas);
    color:var(--ink); font-size:18px; cursor:pointer; flex:none}
  .side-toggle:hover{background:var(--surface)}
  .side-dim{display:none}
  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; background:var(--canvas); border:1px solid var(--line-soft);
    border-top:3px solid var(--yellow); border-radius:14px; padding:12px 14px; margin-bottom:20px; box-shadow:var(--shadow)}
  .toolbar .sub{font-size:13.5px; color:var(--gray); font-weight:600}
  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  select,input[type=search]{font-family:inherit; font-size:14px; padding:9px 13px; border:1px solid var(--line); border-radius:11px; background:var(--canvas); color:var(--ink)}
  select{cursor:pointer; font-weight:600}
  .btn{background:var(--canvas); border:1px solid var(--line); padding:9px 15px; border-radius:11px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; font-family:inherit}
  .btn:hover{background:var(--surface)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent-line)}
  .btn.sm{padding:6px 11px; font-size:12.5px}
  .seg{display:inline-flex; background:var(--surface); border-radius:11px; padding:3px; border:1px solid var(--line-soft)}
  .seg button{border:none; background:none; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; color:var(--gray); cursor:pointer; font-family:inherit; white-space:nowrap}
  .seg button.on{background:var(--canvas); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
  #modeSeg button.on.share{background:var(--accent); color:var(--accent-ink)}

  .notice{display:flex; gap:11px; align-items:flex-start; background:var(--accent-soft); border-radius:14px; padding:14px 16px; margin-bottom:20px}
  .notice .k{flex:0 0 auto; background:var(--accent); color:var(--accent-ink); font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:20px}
  .notice .t{font-size:13.5px; color:var(--ink-soft); line-height:1.6}
  .notice.danger{background:var(--red-soft)} .notice.danger .k{background:var(--red); color:#fff}

  .ov-tiles{display:grid; grid-template-columns:repeat(var(--n,5),minmax(0,1fr)); gap:14px; margin-bottom:22px}
  .ov-tile{background:var(--canvas); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); border-left:4px solid var(--c,var(--accent-line))}
  .ov-tile .ov-name{font-size:14px; font-weight:600; color:var(--gray); display:flex; align-items:center; gap:6px}
  .ov-tile .ov-val{font-size:34px; font-weight:800; letter-spacing:-.03em; margin-top:9px; line-height:1}
  .ov-tile .ov-val small{font-size:15px; font-weight:600; color:var(--gray2); margin-left:3px}
  .ov-tile .ov-sub{font-size:12.5px; font-weight:600; margin-top:7px; color:var(--gray2)}
  .ov-tile.grand{background:linear-gradient(135deg,#0071e3,#4a9bff); border-left-color:#0060c0}
  .ov-tile.grand .ov-name,.ov-tile.grand .ov-sub,.ov-tile.grand .ov-val small{color:rgba(255,255,255,.9)}
  .ov-tile.grand .ov-val{color:#fff}

  .card{background:var(--canvas); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); margin-bottom:22px}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap}
  .card-head h3{font-size:17px; font-weight:700; letter-spacing:-.01em; display:flex; align-items:center; gap:8px}
  .hint{font-size:12.5px; color:var(--gray2)}
  .grid2{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr); gap:22px; align-items:start}
  .grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid2 > .card{margin-bottom:0} .grid-gap{margin-bottom:22px}

  .src-tag{display:inline-block; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:6px; letter-spacing:.02em; white-space:nowrap}
  .src-cs{background:var(--surface); color:var(--gray); border:1px solid var(--line)}
  .src-oc{background:var(--accent-soft); color:var(--accent-deep); border:1px solid var(--accent-line)}
  .src-both{background:var(--ink); color:var(--canvas)}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{text-align:left; font-size:12px; font-weight:700; color:var(--gray); padding:10px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface2)}
  td{padding:11px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .tbl-scroll{overflow-x:auto}
  table.nowrap td{white-space:nowrap}
  .tag,.badge{white-space:nowrap} td b{white-space:nowrap}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
  tr.open td{background:var(--accent-soft)}
  .muted{color:var(--gray2)}
  .link{color:var(--accent-deep); font-weight:700; cursor:pointer; background:none; border:none; font:inherit; padding:0; text-align:left}
  .link:hover{text-decoration:underline}

  .badge{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px}
  .b-done{background:var(--green-soft); color:var(--green)}
  .b-open{background:var(--orange-soft); color:var(--orange)}
  .b-toss{background:var(--purple-soft); color:var(--purple)}
  .b-gray{background:var(--surface); color:var(--gray)}
  .b-red{background:var(--red-soft); color:var(--red)}
  .m-cs::before,.m-remote::before,.m-visit::before{content:""; width:8px; height:8px; border-radius:2px; display:inline-block}
  .m-cs::before{background:var(--s1)} .m-remote::before{background:var(--s2)} .m-visit::before{background:var(--s3)}
  .tag{display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:7px; background:var(--surface); color:var(--ink-soft); margin:0 4px 4px 0}
  .tag.warn{background:var(--orange-soft); color:var(--orange)}
  .tag.red{background:var(--red-soft); color:var(--red)}

  /* 상담 내역 펼침: CS 흐름 카드 아래에 원격·방문 카드를 이어 붙입니다 */
  .flow{display:flex; flex-direction:column; gap:10px; padding:6px 4px 10px}
  .facts{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:12.5px; color:var(--gray)}
  .facts b{color:var(--ink); font-weight:700}
  .fc{border-radius:12px; padding:12px 14px; border:1px solid var(--line-soft); background:var(--canvas)}
  .fc .fh{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; margin-bottom:6px; color:var(--gray)}
  .fc .fb{font-size:13.5px; color:var(--ink); white-space:pre-wrap}
  .fc.q{background:var(--surface2)}
  .fc.a{border-left:4px solid var(--s1)}
  .fc.r{border-left:4px solid var(--s2); background:var(--accent-soft); border-color:var(--accent-line)}
  .fc.v{border-left:4px solid var(--s3)}
  .fc.t{border-left:4px solid var(--purple)}
  .fc .kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px 16px; font-size:12.5px; margin-bottom:8px}
  .fc .kv span{color:var(--gray)} .fc .kv b{display:block; color:var(--ink); font-size:13.5px}
  .attach{font-size:12px; font-weight:700; color:var(--accent-deep); display:flex; align-items:center; gap:6px; padding-left:6px}
  .attach::before{content:"↳"}

  .hbar{display:flex; align-items:center; gap:12px; padding:6px 4px; border-radius:9px}
  .hbar:hover{background:var(--surface2)}
  .hbar .nm{flex:0 0 132px; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hbar .tr{flex:1; height:12px; background:var(--surface); border-radius:6px; overflow:hidden}
  .hbar .fl{height:100%; background:var(--bar); border-radius:0 4px 4px 0; min-width:4px}
  .hbar .v{flex:0 0 112px; white-space:nowrap; text-align:right; font-size:12.5px; color:var(--gray); font-variant-numeric:tabular-nums}
  .hbar .v b{color:var(--ink); font-size:14px}

  .stack{display:flex; gap:2px; height:30px; border-radius:8px; overflow:hidden; margin:6px 0 10px}
  .stack div{height:100%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; min-width:2px}
  .legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--ink-soft)}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
  .flow-stats{display:grid; gap:10px; margin-top:16px}
  .fstat{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:11px; background:var(--surface2); border:1px solid var(--line-soft)}
  .fstat span{font-size:13px; color:var(--gray); font-weight:600}
  .fstat b{font-size:20px; font-weight:800; letter-spacing:-.02em}
  .fstat small{font-size:12px; color:var(--gray2); font-weight:600; margin-left:3px}

  .rep-row{display:flex; align-items:center; gap:14px; cursor:pointer; padding:7px 8px; border-radius:10px}
  .rep-row:hover{background:var(--surface)}
  .rep-nm{flex:0 0 120px; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rep-bar{flex:1 1 150px; min-width:80px; height:12px; background:var(--surface); border-radius:7px; overflow:hidden}
  .rep-fill{height:100%; border-radius:0 4px 4px 0; background:var(--bar); min-width:6px}
  .rep-n{flex:0 0 auto; font-size:12.5px; color:var(--gray); min-width:52px}
  .rep-n b{font-size:15px; color:var(--ink)}
  .rep-cats{flex:1 1 240px; display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end}

  .chart svg{display:block; width:100%; height:auto}
  .chart .axis{fill:var(--gray2); font-size:10.5px}
  .chart .gl{stroke:var(--line-soft); stroke-width:1}
  .chart .bar{fill:var(--bar)}
  .chart .hit{fill:transparent}
  .chart g.on .bar{fill:var(--accent-deep)}
  .chart .lbl{fill:var(--ink-soft); font-size:10.5px; font-weight:700}
  #tip{position:fixed; pointer-events:none; background:var(--ink); color:var(--canvas); font-size:12.5px; font-weight:600; padding:7px 10px; border-radius:9px; opacity:0; transition:opacity .1s; z-index:50; white-space:nowrap}
  #tip b{font-size:14px}

  .eq-item{display:inline-block; white-space:nowrap; font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:8px; background:var(--surface); margin:0 4px 4px 0; border:1px solid var(--line-soft)}
  .eq-item.off{color:var(--gray2); text-decoration:line-through}
  .chk{display:grid; grid-template-columns:1fr auto; border:1px solid var(--line-soft); border-radius:12px; overflow:hidden}
  .chk div{padding:10px 14px; border-bottom:1px solid var(--line-soft); font-size:13.5px}
  .chk div:nth-last-child(-n+2){border-bottom:none}
  .chk .d{font-size:11.5px; color:var(--gray2); display:block; margin-top:2px}
  .ok{color:var(--green); font-weight:800} .ng{color:var(--red); font-weight:800} .na{color:var(--gray2); font-weight:700}
  .chk-mini{font-size:12.5px; font-weight:700}

  .store-stats{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; margin-bottom:20px}
  .store-stat{background:var(--surface2); border:1px solid var(--line-soft); border-radius:13px; padding:12px 14px}
  .store-stat .label{font-size:12px; color:var(--gray); font-weight:700}
  .store-stat b{display:block; font-size:22px; font-weight:800; margin-top:4px}
  .store-stat small{font-size:11.5px; color:var(--gray2)}
  .tl{position:relative; padding-left:18px}
  .tl::before{content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line-soft)}
  .tl-i{position:relative; padding:6px 0 10px}
  .tl-i::before{content:""; position:absolute; left:-17px; top:12px; width:10px; height:10px; border-radius:50%; background:var(--canvas); border:2px solid var(--s1)}
  .tl-i.oc::before{border-color:var(--s2); background:var(--accent)}
  .tl-i.vs::before{border-color:var(--s3)}
  .tl-i .w{font-size:12px; color:var(--gray2); font-weight:600}
  .tl-i .x{font-size:13.5px; margin-top:2px}
  .side-list > div{padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px}

  .hc-res{display:inline-block; font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:6px; margin:0 3px 3px 0}
  .r-ok{background:var(--green-soft); color:var(--green)} .r-issue{background:var(--orange-soft); color:var(--orange)} .r-na{background:var(--surface); color:var(--gray2)}

  .rep{background:var(--canvas); border-radius:var(--radius); padding:34px 38px; box-shadow:var(--shadow)}
  .rep-head{border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:26px}
  .rep-head .rh-client{font-size:13px; font-weight:800; color:var(--accent-deep); letter-spacing:.04em}
  .rep-head h2{font-size:27px; font-weight:800; letter-spacing:-.03em; margin-top:7px; line-height:1.25}
  .rep-head .rh-meta{display:flex; flex-wrap:wrap; gap:18px; margin-top:14px; font-size:13px; color:var(--gray)}
  .rep-head .rh-meta b{color:var(--ink)}
  .rep-kpi{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:26px}
  .rk{border:1px solid var(--line); border-radius:14px; padding:14px 16px}

  .rk .v{font-size:28px; font-weight:800; letter-spacing:-.02em; margin-top:4px}

  table.rep-tbl th{background:var(--surface)}
  table.rep-tbl tfoot td{font-weight:800; border-top:1px solid var(--line)}
  .rep-note{font-size:12.5px; color:var(--gray); margin-top:9px}
  .rep-memo{border:1px dashed var(--accent-line); background:var(--accent-soft); border-radius:12px; padding:14px 16px; font-size:13.5px; line-height:1.7}
  .delta.up{color:var(--red); font-weight:700} .delta.down{color:var(--green); font-weight:700} .delta.flat{color:var(--gray2)}

  .empty{padding:30px; text-align:center; color:var(--gray)}
  .loading{padding:80px 20px; text-align:center; color:var(--gray); font-size:15px}
  .internal-mark{font-size:10.5px; font-weight:800; color:var(--red); border:1px solid var(--red); border-radius:5px; padding:0 5px; margin-left:4px}
  body.share .internal{display:none !important}
  .share-only{display:none} body.share .share-only{display:flex}

  /* 메뉴: 상담 내역 아래 하위 항목 · 메뉴 안 닫기 버튼 */
  .side-close{margin-left:auto; width:30px; height:30px; border:1px solid var(--line); border-radius:8px; background:var(--canvas); color:var(--gray); font-size:15px; cursor:pointer}
  .side-close:hover{background:var(--surface); color:var(--ink)}
  .side-toggle{width:auto; padding:0 12px; gap:6px; font-size:15px} .side-toggle span{font-size:13px; font-weight:700}
  .view-tab.parent.in{color:var(--ink); font-weight:800}
  .sub-tabs{display:flex; flex-direction:column; gap:2px; margin:0 0 2px 14px; padding-left:8px; border-left:2px solid var(--line-soft)}
  .view-tab.sub{font-size:14px; padding:8px 12px}

  /* 검색 · 태그 줄 */
  .fbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px; padding:10px; border-radius:12px; background:var(--surface2); border:1px solid var(--line-soft)}
  .fbar input[type=search]{min-width:150px; flex:0 1 190px; padding:8px 12px; font-size:13.5px}
  .fbar select{padding:8px 10px; font-size:13px; max-width:180px}
  .fbar-end{margin-left:auto; display:flex; align-items:center; gap:8px}
  /* 펼친 줄 */
  tr.xd > td{background:var(--surface2); padding:4px 10px 12px}
  .caret{font-size:11px; color:var(--gray2); margin-left:4px}
  .tag.in-cs{background:var(--accent-soft); color:var(--accent-deep)} .tag.in-oc{background:var(--orange-soft); color:var(--orange)}
  .tag.in-vs{background:var(--green-soft); color:var(--green)} .tag.in-etc{background:var(--purple-soft); color:var(--purple)}
  .rep-wrap{border-radius:10px} .rep-wrap.open{background:var(--surface2)} .rep-detail{padding:4px 8px 12px}

  /* 이슈 · VOC 상세: 세부 정보 · 현상 · 요청 · 조치 */
  .vp{display:grid; grid-template-columns:minmax(0,.8fr) repeat(var(--n,3),minmax(0,1fr)); gap:12px; padding:8px 0}
  .vp-box{border-radius:14px; padding:14px 16px; background:var(--canvas); border:1px solid var(--line-soft)}
  .vp-box.asis{background:var(--red-soft); border-color:transparent} .vp-box.tobe{background:var(--green-soft); border-color:transparent} .vp-box.act{background:var(--accent-soft); border-color:transparent}
  .vp-h{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:800; margin-bottom:8px}
  .vp-h i{font-style:normal; width:22px; height:22px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:#fff; background:var(--gray)}
  .asis .vp-h{color:var(--red)} .asis .vp-h i{background:var(--red)} .tobe .vp-h{color:var(--green)} .tobe .vp-h i{background:var(--green)} .act .vp-h{color:var(--accent-deep)} .act .vp-h i{background:var(--accent)}
  .info .vp-h{font-size:12px; color:var(--gray)}
  .vp-t{font-size:13.5px; line-height:1.75; white-space:pre-wrap; overflow-wrap:anywhere}
  .vp-kv{display:grid; grid-template-columns:80px 1fr; gap:8px; padding:7px 0; border-top:1px solid var(--line-soft); font-size:12.5px}
  .vp-kv span{color:var(--gray); font-weight:700} .vp-kv b{font-weight:600; white-space:pre-wrap; overflow-wrap:anywhere}

  /* 해피콜: 매장 카드 → 펼치면 질문 스크립트와 매장 답변 */
  .hc-list{display:grid; gap:10px}
  .hc-card{border:1px solid var(--line-soft); border-radius:14px; background:var(--canvas); overflow:hidden}
  .hc-card.open{border-color:var(--yellow)}
  .hc-head{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 16px; cursor:pointer}
  .hc-head:hover{background:var(--surface2)}
  .hc-store{font-size:15px; font-weight:800} .hc-meta{font-size:12px; color:var(--gray2); margin-top:4px}
  .hc-results{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px} .hc-side{display:flex; align-items:center; gap:10px; flex:none}
  .hc-body{border-top:1px solid var(--line-soft); background:var(--surface2); padding:14px 16px 16px; display:grid; gap:10px}
  .r-none{background:var(--canvas); color:var(--gray2); border:1px dashed var(--line)}
  .hq{border:1px solid var(--line-soft); border-radius:12px; background:var(--canvas); padding:14px 16px}
  .hq-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px} .hq-title{font-size:14px; font-weight:800} .hq-title span{font-weight:600; color:var(--gray2)}
  .hq-qa{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:12px; margin-top:11px}
  .hq-tag{font-size:11px; font-weight:800; color:var(--gray2); margin-bottom:6px}
  .hq-q{background:var(--surface); border-radius:10px; padding:10px 12px; color:var(--gray); font-size:12.5px; line-height:1.65}
  .hq-a{border-radius:10px; padding:10px 14px 12px; background:var(--surface); font-size:13px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere}
  .hq.ok .hq-a{background:var(--green-soft)} .hq.issue .hq-a{background:var(--red-soft)}
  .hc-item{display:flex; align-items:center; gap:12px; padding:6px 4px}
  .hc-item .nm{flex:0 0 170px; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hc-item .bar3{flex:1; display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--surface)}
  .bar3 i{display:block; height:100%} .bar3 .ok{background:var(--green)} .bar3 .is{background:var(--red)} .bar3 .na{background:var(--muted)}
  .hc-item .v{flex:0 0 110px; text-align:right; font-size:12.5px; color:var(--gray)} .hc-item .v.bad{color:var(--red); font-weight:700}

  /* 상담 가이드 · 포스 매뉴얼(노션 CX 가이드에서 옮김): 카드 · 단계 · 스크립트 */
  .guide{--g-soft:#fff3b0; --g-ink:#4a3f00; --g-info:#fff8d6; --g-info-line:#ebdb8c; --g-warn-line:#fed7aa}
  :root[data-theme="dark"] .guide{--g-soft:#3a3205; --g-ink:#ffe680; --g-info:#2a2506; --g-info-line:#5c4f0a; --g-warn-line:#7c3a12}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .guide{--g-soft:#3a3205; --g-ink:#ffe680; --g-info:#2a2506; --g-info-line:#5c4f0a; --g-warn-line:#7c3a12} }
  .guide{font-size:14.5px; line-height:1.65; word-break:keep-all}
  .g-stack{display:flex; flex-direction:column; gap:18px}
  .g-grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
  .g-grid.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
  .g-card{background:var(--canvas); border-radius:16px; box-shadow:var(--shadow); padding:22px; min-width:0; display:flex; flex-direction:column; gap:12px}
  .g-card.tint{background:var(--g-info); box-shadow:none; border:1px solid var(--g-info-line)}
  .g-head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
  .g-h2{margin:0; font-size:19px; font-weight:800; letter-spacing:-.01em} .g-h3{margin:0; font-size:16px; font-weight:700}
  .g-lead{margin:0; color:var(--ink-soft); font-size:14px} .g-small{margin:0; color:var(--gray); font-size:13px}
  .g-label{font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--gray)} .g-b{font-weight:700; color:var(--ink)}
  .g-list,.g-steps{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; font-size:14px}
  .g-list li{position:relative; padding-left:14px} .g-list li::before{content:""; position:absolute; left:0; top:10px; width:5px; height:5px; border-radius:50%; background:var(--gray2)}
  .g-steps{counter-reset:gs; gap:10px} .g-steps li{counter-increment:gs; position:relative; padding-left:34px; min-height:24px}
  .g-steps li::before{content:counter(gs); position:absolute; left:0; top:1px; width:24px; height:24px; border-radius:50%; background:var(--yellow); color:var(--yellow-ink); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center}
  .g-warn{background:var(--orange-soft); border:1px solid var(--g-warn-line); color:var(--orange); border-radius:10px; padding:12px 14px; font-size:14px}
  .g-info{background:var(--g-info); border:1px solid var(--g-info-line); color:var(--g-ink); border-radius:10px; padding:12px 14px; font-size:14px}
  .g-quote{background:var(--surface); border-radius:10px; padding:12px 14px; font-size:14px; color:var(--ink-soft)}
  .g-tag{display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--surface); color:var(--ink-soft); white-space:nowrap}
  .g-tag.on{background:var(--g-soft); color:var(--g-ink)} .g-tag.bad{background:var(--red-soft); color:var(--red)} .g-tag.warn{background:var(--orange-soft); color:var(--orange)}
  .g-num{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px; background:var(--g-soft); color:var(--g-ink); font-weight:800; font-size:13px}
  .g-tbox{overflow-x:auto; border:1px solid var(--line-soft); border-radius:12px}
  .g-tbl td{white-space:normal}
  .g-kpi{font-size:28px; font-weight:800; line-height:1.2}
  .g-alert{border-top:4px solid var(--line)} .g-alert.r{border-top-color:var(--red)} .g-alert.o{border-top-color:var(--orange)} .g-alert.b{border-top-color:var(--yellow)}
  .g-pills{display:flex; flex-wrap:wrap; gap:8px}
  .g-pill{border:1px solid var(--line); background:var(--canvas); color:var(--ink); border-radius:999px; padding:0 16px; min-height:40px; font:inherit; font-size:14px; font-weight:600; cursor:pointer}
  .g-pill:hover{background:var(--surface)} .g-pill[aria-pressed="true"]{background:var(--yellow); border-color:var(--yellow); color:var(--yellow-ink); font-weight:800}
  .g-say{white-space:pre-line; background:var(--surface); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.7}
  .g-sms{white-space:pre-line; border:1px dashed var(--line); border-radius:10px; padding:14px 16px; font-size:13px; line-height:1.7; color:var(--ink-soft); overflow-wrap:anywhere}
  .g-qt{margin:0 0 6px; font-size:13px; font-weight:700; color:var(--g-ink)}
  .g-blk,.g-col{display:flex; flex-direction:column} .g-col{gap:16px; min-width:0}
  .g-copy{align-self:flex-start; margin-top:6px}
  .g-foot{margin:4px 0 0; text-align:center; font-size:12.5px; color:var(--gray2)}
  .g-mlink{align-self:flex-start; display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:700; color:var(--accent-deep); text-decoration:none; border:1px solid var(--g-info-line); background:var(--g-info); border-radius:999px; padding:4px 12px; min-height:32px}
  .g-check{display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:10px}
  .g-idx{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr)); gap:10px}
  .g-idx a{display:flex; flex-direction:column; gap:2px; height:100%; padding:12px 14px; border:1px solid var(--line-soft); border-radius:10px; color:var(--ink); text-decoration:none}
  .g-idx a:hover{border-color:var(--yellow); background:var(--g-info)} .g-idx b{font-size:15px} .g-idx span{font-size:13px; color:var(--gray)} .g-idx em{font-style:normal; font-size:12px; color:var(--g-ink); font-weight:700}
  .linkish{color:var(--accent-deep)} .guide .mono{font-variant-numeric:tabular-nums}
  .guide [hidden]{display:none !important}
  .g-hidden{display:none !important}
  /* 업데이트 글쓰기 */
  .upd-form label{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:700; color:var(--gray); margin-bottom:10px}
  .upd-form input:not([type=checkbox]),.upd-form select,.upd-form textarea{font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--canvas); color:var(--ink); width:100%}
  .upd-form textarea{resize:vertical; line-height:1.6}
  .upd-grid{display:grid; grid-template-columns:200px minmax(0,1fr); gap:12px; align-items:end}
  .upd-form label.chk-line{flex-direction:row; align-items:center; gap:8px; font-size:13.5px; color:var(--ink); padding-bottom:10px}
  @media (max-width:820px){ .upd-grid{grid-template-columns:minmax(0,1fr)} }
  @media (max-width:1180px){ .vp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
  @media (max-width:820px){ .vp,.hq-qa{grid-template-columns:minmax(0,1fr)} .fbar input[type=search]{flex:1 1 140px} .fbar-end{margin-left:0} .hc-item .nm{flex-basis:110px} .side-toggle span{display:none} }
  @media print{ .fbar{display:none !important} }
  @media (max-width:1180px){ .ov-tiles{grid-template-columns:repeat(3,minmax(0,1fr))} .store-stats{grid-template-columns:repeat(3,minmax(0,1fr))} .grid2,.grid2.even{grid-template-columns:minmax(0,1fr)} .grid2 > .card{margin-bottom:22px} .rep-kpi{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:820px){
    .page{padding:20px 16px 60px; overflow-x:hidden} .title{font-size:24px}
    /* 휴대폰: 메뉴는 기본으로 닫혀 있고 ☰을 누르면 화면 위로 열립니다(바깥을 누르면 닫힘). */
    .side{position:fixed; left:0; top:0; z-index:40; margin-left:-229px; box-shadow:var(--shadow)}
    body.side-open .side{margin-left:0}
    body.side-open .side-dim{display:block; position:fixed; inset:0; z-index:39; background:rgba(0,0,0,.35)}
    .toolbar{align-items:flex-start; flex-direction:column}
    .ov-tiles{grid-template-columns:repeat(2,minmax(0,1fr)) !important} .ov-tile .ov-val{font-size:28px}
    .store-stats{grid-template-columns:repeat(2,minmax(0,1fr))} .seg{max-width:100%; overflow-x:auto}
    .rep{padding:22px 18px}
    .hbar .nm,.rep-nm{flex-basis:92px} .rep-cats{display:none}
  }
  @media print{ .top-actions,.side,.side-toggle,.toolbar{display:none !important} body{background:#fff} .page{padding:0; max-width:none} .rep{box-shadow:none; padding:0} }
</style>
</head>
<body>
<div class="shell">
<aside class="side" id="side" aria-label="카테고리">
  <div class="side-brand"><span class="eyebrow">COMPOSE</span>통합 대시보드<button class="side-close" id="sideClose" title="메뉴 닫기" aria-label="메뉴 닫기">«</button></div>
  <button class="grp" data-g="ops">운영</button>
  <div class="grp-body">
    <button class="view-tab" data-v="overview">전체현황</button>
    <button class="view-tab parent" data-v="records">상담 내역</button>
    <div class="sub-tabs">
      <button class="view-tab sub" data-v="records">실시간 인입</button>
      <button class="view-tab sub" data-v="issues">이슈 · VOC</button>
    </div>
    <button class="view-tab" data-v="happy">해피콜</button>
    <button class="view-tab" data-v="equip">장비 조회</button>
    <button class="view-tab" data-v="stores">지점별</button>
  </div>
  <button class="grp internal" data-g="internal">내부용</button>
  <div class="grp-body internal">
    <button class="view-tab" data-v="report">월간 보고서</button>
    <button class="view-tab parent" data-v="principles">상담 가이드</button>
    <div class="sub-tabs">
      <button class="view-tab sub" data-v="principles">응대 원칙</button>
      <button class="view-tab sub" data-v="incident">장애 대응</button>
      <button class="view-tab sub" data-v="happycall">해피콜 스크립트</button>
    </div>
    <button class="view-tab" data-v="posmanual">포스 매뉴얼</button>
    <button class="view-tab" data-v="updates">업데이트</button>
  </div>
</aside>
<div class="side-dim" id="sideDim"></div>
<main class="page">
  <header class="top">
    <div>
      <div class="eyebrow">COMPOSE</div>
      <div class="title-row"><button class="side-toggle" id="sideToggle" title="메뉴 열기·닫기" aria-label="메뉴 열기·닫기" aria-expanded="true">☰ <span>메뉴</span></button><div class="title" id="pgTitle">컴포즈 통합 대시보드</div><span class="data-badge" id="dataBadge">불러오는 중</span></div>
    </div>
    <div class="top-actions">
      <span class="updated"><span class="src-tag src-cs">CS</span> <span id="csTime">—</span> · <span class="src-tag src-oc">원격</span> <span id="ocTime">—</span></span>
      <div class="seg" id="modeSeg" title="공유용 = 토스플레이스 공유 화면"><button data-m="internal" class="on">내부용</button><button data-m="share">공유용</button></div>

  <div id="viewHost"><div class="loading">CS 리포트와 원격팀 기록을 불러오는 중입니다…</div></div>
  <!-- 내부용 상담 가이드 원문 자리: 회사 계정 화면에만 채웁니다(Apps Script doGet · 미리보기 build). 공유용 화면에는 비어 있습니다. -->

<script>
/* ===== 원격팀 장비 파서 (offcare-dashboard/franchise/equip-parse.js 복사본 · tools/build.js가 넣음) ===== */
/*
 * ============================================================
 *  장비 파서 (client.html '장비 조회' 탭 공용)
 * ============================================================
 *  현장방문 워크플로우의 '장비' 칸은 자유 텍스트다.
 *    '포스기 1EA + 프론트 1EA + 유선프린터기(주방용) 3EA + 금전함 1EA'
 *    '포스 프론트 유선프린터2대 금전함'
 *    'TS100E -> CPP_3000로 교체'
 *  여기서 장비 종류·수량·모델·기존보유 여부를 뽑고, 글 전체가
 *  설치 / 교체 / 회수 / AS / 점검 중 무엇인지 판정한다.
 *
 *  node 에서도 그대로 돌려 검증할 수 있게 window 에만 의존한다.
 *  규칙을 고치면 visit-data.js 전 건에 돌려서 확인할 것 (자유 텍스트라 한 건 고치면 다른 건이 깨진다).
 * ============================================================
 */
(function(global){
  'use strict';

  /* 장비 종류. 배열 순서 = 매칭 우선순위.
     긴 이름이 먼저 와야 한다 — '프론트캠' 을 '프론트' 가 먼저 먹으면 안 되므로
     매칭된 구간은 지우고 다음 종류를 찾는다. */
  const TYPES = [
    {key:'frontcam', name:'프론트캠',          re:/프론트\s*캠/gi},
    {key:'multipad', name:'멀티패드',          re:/멀티\s*패드/gi},
    {key:'keypad',   name:'배리어프리 키패드', re:/배리어\s*(?:프리|플리)\s*키\s*패드/gi},
    {key:'kiosk',    name:'키오스크',          re:/키오스크|kiosk/gi},
    {key:'monitor',  name:'듀얼모니터',        re:/듀얼\s*모니터/gi},
    /* '벽브라캣' 의 '캣' 을 단말기로 읽지 않도록 한글 사이에 낀 캣은 제외 */
    {key:'cat',      name:'CAT 단말기',        re:/cat\s*단말기|캣\s*단말기|\bcat\b|(?<![가-힣])캣(?![가-힣])|(?:타사\s*)?단말기/gi},
    {key:'wprinter', name:'무선프린터',        re:/무선\s*프린터|무프/gi},
    {key:'printer',  name:'유선프린터',        re:/(?:유선|주방|홀)?\s*프린터기?|유프/gi},
    {key:'drawer',   name:'금전함',            re:/금전\s*한?함/gi},
    {key:'scanner',  name:'바코드스캐너',      re:/(?:바코드\s*)?스캐너/gi},
    {key:'tablet',   name:'태블릿',            re:/태블릿|kds/gi},
    {key:'terminal', name:'터미널',            re:/터미널/gi},
    {key:'front',    name:'프론트',            re:/프론트|트론트/gi},
    /* 아펙사·APEXA 는 모델(MODELS)로만 잡는다 — 'APEXA15' 의 15 를 수량으로 읽기 때문 */
    {key:'pos',      name:'포스',              re:/포스기?|\bpos\b/gi},
    {key:'pc',       name:'PC·노트북',         re:/개인\s*(?:소유)?\s*(?:pc|컴퓨터)|자체\s*pc|노트북|컴퓨터|\bpc\b/gi},
  ];
  /* 모델명 → 장비 종류. 종류 단어가 같이 있으면 모델로 붙고, 모델만 있으면 그 장비 1대로 센다 */
  const MODELS = [
    {type:'printer', re:/\b(ts-?\s?\d{3,4}\w?|cpp[-_ ]?\d{3,4}|dk\s?9300)\b/gi},
    {type:'cat',     re:/\b(kis-?\d{3,4}|nc\d{4}|[ne]250|ssrp-?\d{4})\b/gi},
    {type:'kiosk',   re:/\b(t6d)\b/gi},
    {type:'scanner', re:/\b(tsk-?\d{3,4})\b/gi},
    {type:'pos',     re:/(apexa\s?\d*|아펙사|퍼스트포스|하나시스(?:\s*플러스)?|아임유포스|메이트\s*포스)/gi},
  ];
  const TYPE_MAP = Object.fromEntries(TYPES.map(t=>[t.key, t]));

  /* 길이를 보존해 공백으로 덮는다 — 위치가 어긋나면 수량을 엉뚱한 장비에 붙인다 */
  const blank = (s, re) => s.replace(re, m => ' '.repeat(m.length));

  /* 매칭 직후의 수량. '포스기 2EA(메인/오더)', '유선프린터2대', '프론트1', '유선프린터기(주방용) 3EA'
     괄호 하나는 건너뛰되, 괄호 안 숫자(KIS-1421 같은 모델)는 수량으로 읽지 않는다. */
  function qtyAfter(s){
    const t = s.replace(/^\s*(?:기\s*)?\((?:[^()]|\([^()]*\))*\)/, '');
    const m = t.match(/^\s*[x×]?\s*(\d{1,2})\s*(?:ea|대|개|set)?(?![\d\-])/i);
    return m ? +m[1] : 1;
  }

  function parseItems(text){
    /* 전처리
       · '토스포스'(프로그램)는 장비가 아니다
       · '포스기세트(포스+프론트+…)' 의 '포스기세트' 는 괄호 안 구성품의 이름표라 따로 세지 않는다 */
    let src = String(text == null ? '' : text);
    src = blank(src, /토스\s*_?\s*포스(?:\s*프로그램)?/gi);
    src = blank(src, /[가-힣A-Za-z]*\s*세트\s*(?=\()/gi);
    MODELS.forEach(md => { md.re.lastIndex = 0; });

    /* 모델명 안의 '포스'(퍼스트포스·아임유포스·메이트 포스)를 장비 단어로 다시 세지 않게 가린다 */
    let work = blank(src, MODELS.find(md => md.type === 'pos').re);
    MODELS.forEach(md => { md.re.lastIndex = 0; });
    const hits = [];
    TYPES.forEach(function(t){
      t.re.lastIndex = 0;
      const mine = [];
      let m;
      while((m = t.re.exec(work))){
        if(!m[0].trim()){ t.re.lastIndex++; continue; }
        const lead = m[0].length - m[0].replace(/^\s+/, '').length;   // '(?:유선)?\s*프린터' 앞 공백
        mine.push({type:t.key, at:m.index + lead, end:m.index + m[0].length});
      }
      /* 찾은 구간은 지워서 짧은 이름이 다시 먹지 못하게 한다 */
      mine.forEach(h=>{ work = work.slice(0,h.at) + ' '.repeat(h.end-h.at) + work.slice(h.end); });
      hits.push.apply(hits, mine);
    });
    hits.sort((a,b)=>a.at-b.at);

    const items = {};
    const get = type => items[type] || (items[type] = {type:type, name:TYPE_MAP[type].name, qty:0, models:[], existing:false});
    /* 장비 바로 뒤 괄호가 덮는 구간. 그 안의 같은 종류 단어는 설명이다
       ('태블릿 1EA(KDS용)' 의 KDS, '포스기(메인/오더 포스)' 의 포스) — 세지 않는다 */
    const covered = {};
    hits.forEach(function(h, i){
      const next = i+1 < hits.length ? hits[i+1].at : src.length;
      /* 다른 장비 이름에 딱 붙은 단어는 수식어다 ('키오스크배리어프리키패드' 의 키오스크) — 세지 않는다 */
      if(i+1 < hits.length && next === h.end) return;
      if(covered[h.type] && h.at < covered[h.type]) return;
      const pm = src.slice(h.end).match(/^\s*(?:\d{1,2}\s*(?:ea|대|개)?\s*)?(?:기\s*)?\((?:[^()]|\([^()]*\))*\)/i);
      if(pm) covered[h.type] = h.end + pm[0].length;
      const tail = src.slice(h.end, next);
      const it = get(h.type);
      it.qty += qtyAfter(tail);
      /* 기존 보유: 바로 뒤 괄호 '(기존 보유)' · '(점주보유)' 또는 바로 앞 '기존 ' · '개인소유 ' · '매장 보유 ' */
      const paren = pm ? pm[0].match(/\(([\s\S]*)\)/) : null;   // '프론트 1EA(기존 보유)' 처럼 수량 뒤 괄호도
      if((paren && /기존|기보유|보유|소유/.test(paren[1]))
         || /(?:기존|보유|소유)\s*$/.test(src.slice(Math.max(0, h.at-6), h.at))) it.existing = true;
    });
    MODELS.forEach(function(md){
      let m;
      while((m = md.re.exec(src))){
        const it = get(md.type);
        if(!it.qty) it.qty = 1;
        const mdl = m[1].toUpperCase().replace(/\s+/g,'');
        if(it.models.indexOf(mdl) < 0) it.models.push(mdl);
      }
    });
    return TYPES.map(t=>items[t.key]).filter(it=>it && it.qty > 0);
  }

  /* 글 전체의 성격. kind 는 워크플로우의 요청 유형(설치/AS/기타) */
  function eventType(kind, text){
    const t = String(text || '');
    if(/회수|철거/.test(t))                    return '회수';
    if(/교체|->|→/.test(t))                    return '교체';
    if(kind === 'AS')                           return 'AS';
    if(/점검|가결제|재온보딩|환경/.test(t))     return '점검';
    if(kind === '설치')                         return '설치';
    return '기타';
  }

  /* 교체 글에서 '이전 → 새' 모델을 뽑는다 ('TS100E -> CPP_3000로 교체') */
  function replacePair(text){
    const m = String(text || '').match(/([A-Za-z0-9_\-]+)\s*(?:->|→|에서)\s*([A-Za-z0-9_\-]+)/);
    return m ? {from:m[1].toUpperCase(), to:m[2].toUpperCase()} : null;
  }

  /* 원격 AS·온보딩 요청문에서 어떤 장비 얘기인지만 본다 (수량은 의미 없음) */
  function mentions(text){
    return parseItems(text).map(it => it.type);
  }

  global.EquipParse = {
    TYPES:TYPES, TYPE_MAP:TYPE_MAP,
    parseItems:parseItems, eventType:eventType, replacePair:replacePair, mentions:mentions,
  };
})(window);
</script>

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function buildModel(raw) {
  RAW = raw; TODAY = P(raw.now) || new Date();
  CHECK_ITEMS = raw.checkItems || [];
  STORES = []; SM = {};
  const ensure = (name, from) => {
    const k = skey(name);
    if (!k || STORE_EXCLUDE.test(name)) return null;
    if (!SM[k]) { SM[k] = { key: k, name: plainName(name), code: '', kind: '', installed: '', check: null, listed: false, from: new Set(), events: [], inv: [] }; STORES.push(SM[k]); }

  };
  (raw.stores || []).forEach(s => { const o = ensure(s.name, 'list'); if (!o) return; Object.assign(o, { name: plainName(s.name), no: branchNo(s.name), code: s.code || '', kind: s.kind || '', installed: s.installed || '', check: s.check || null, listed: true }); });

  ISSUES.forEach(i => { if (i.receipt) issueByReceipt[i.receipt] = i; });

  // 예전 데이터(결과 글자만 있는 배열)도 { result, answer }로 맞춥니다.
  HAPPY = (raw.happy || []).map((h, n) => Object.assign({}, h, { key: `hc:${n}`, answers: HCQ.map((q, i) => { const a = (h.answers || [])[i]; return a && typeof a === 'object' ? a : { result: a || '', answer: '' }; }) }));

  // 1) CS 상담 내역 = 허브
  RECS = (raw.consults || []).filter(c => !STORE_EXCLUDE.test(c.store || '')).map(c => {
    const at = P(c.at); if (!at) return null;
    const st = ensure(c.store, 'cs'), iss = issueByReceipt[c.receipt];
    const done = P(c.doneAt), sl = c.slack || null;
    // 장비·채널: 통합 이슈 값 → 슬랙 AI 분석 값 → 문의 글에서 추정
    const aiChannel = sl && (CH_RENAMES[sl.aiChannel] || sl.aiChannel);
    const inflow = sl && sl.source && sl.source !== '콜라비' ? sl.source : /현장/.test(c.route || '') ? '현장' : /원격/.test(c.route || '') ? '원격팀' : '콜라비';
    return { id: c.receipt || (c.slackOnly ? `슬랙-${c.at.slice(2, 16).replace(/[- :]/g, '')}` : `CS-${c.at}`), src: 'cs', inflow, slackOnly: !!c.slackOnly, at, date: ymd(at), store: st ? st.name : (c.store || '—'), skey: st ? st.key : '', slack: sl,
      channel: iss && CHANNELS.includes(iss.channel) ? iss.channel : CHANNELS.includes(aiChannel) ? aiChannel : guessChannel([c.major, c.middle, c.minor, c.question].join(' ')),
      cat: [c.major, c.middle].filter(Boolean).join(' · ') || '미분류', q: c.question, a: c.answer, route: c.route || '—', cx: c.cx || '',
      method: c.method || '—', status: c.status || '처리중', doneAt: done, minutes: validMinutes(c.minutes != null ? c.minutes : done ? (done - at) / 60000 : null),
      toss: c.tossAsked ? { asked: P(c.tossAsked), done: P(c.tossDone) } : null, csOwner: c.owner || '', csAction: c.action || '', issue: iss || null, remote: null, visit: null };
  }).filter(Boolean);
  const byStore = {};
  RECS.forEach(r => { (byStore[r.skey] = byStore[r.skey] || []).push(r); });
  const nearest = (k, at, earlyMin, days, ok, prefer) => {
    let best = null, bestScore = Infinity;
    (byStore[k] || []).forEach(c => {
      const diff = (at - c.at) / 60000;
      if (diff < -earlyMin || diff > days * 1440 || !ok(c)) return;
      // 가까운 시각이 먼저, 처리 방식이 맞는 상담은 하루만큼 가산

  // 2) 원격 AS → 같은 매장, 상담 뒤 3일 안(상담보다 30분 이른 기록까지)의 가장 가까운 상담. 원격지원 상담을 먼저 고릅니다.
  //    양쪽 글에서 장비를 알 수 있는데 서로 다르면(예: 프린터 요청 ↔ 키오스크 상담) 붙이지 않습니다.

  const asRecs = (raw.remote && raw.remote.as || []).map(a => Object.assign({}, a, { at: P(`${a.date} ${a.time || '00:00'}`) })).filter(a => a.at && !STORE_EXCLUDE.test(a.store || a.branch || '')).sort((x, y) => x.at - y.at);

    const c = nearest(k, a.at, LINK.AS_EARLY_MIN, LINK.AS_DAYS, x => x.src === 'cs' && !(x.remote && x.remote.linked) && sameDevice(x.channel, `${a.req} ${a.note}`), x => x.method === '원격지원' || x.method === '방문점검');
    if (c) { c.remote = Object.assign(remote, { handoff: c.at }); asLinked++; }
    else ocRec({ id: `원격-${a.date.slice(2).replace(/-/g, '.')}-${pad(orphans.length + 1)}`, inflow: '원격팀', store: a.store || a.branch, at: a.at, channel: guessChannel(`${a.req} ${a.note}`),
      q: a.req, a: '', method: '원격지원', status: a.status === 'done' ? '완료' : '처리중', remote: Object.assign(remote, { handoff: null }) });
    const st = SM[k]; if (st) st.events.push({ date: a.date, type: 'AS', src: '원격', text: [a.req, a.note].filter(Boolean).join(' → '), by: a.emp, items: mentionItems(`${a.req} ${a.note}`), rec: c ? c.id : null });
  });
  // CS에서 원격지원으로 적었지만 원격팀 기록과 연결되지 않은 상담: CS의 원격 담당자 · 조치 내용으로 카드를 만듭니다.
  let csOnly = 0;
  RECS.forEach(r => { if (!r.remote && r.method === '원격지원') { csOnly++; r.remote = { owner: r.csOwner, start: null, handoff: r.at, action: r.csAction, linked: false }; } });
  // 슬랙 담당자 확인 이모지(선유_확인 등) 시각 = 원격 착수 시각. 원격팀 기록보다 정확하므로 대기 시간은 이 값을 먼저 씁니다.
  RECS.forEach(r => {
    const sl = r.slack; if (!sl || !sl.ownerAt) return;
    if (!r.remote) r.remote = { owner: sl.owner, start: null, handoff: r.at, action: sl.action || r.csAction, linked: false };
    r.remote.ackAt = P(sl.ownerAt); r.remote.owner = sl.owner || r.remote.owner;
  });

  // 3) 현장 방문: 설치는 장비 이력 · 설치일, AS는 상담(10일 안)에 붙입니다.
  let visitLinked = 0, visitAs = 0;
  (raw.remote && raw.remote.visits || []).forEach(v => {

    const st = ensure(v.store, 'oc'); if (!st) return;

    const ev = { date: ymd(vd), type, src: '방문', text: v.equip, by: v.assignee, items: window.EquipParse ? EquipParse.parseItems(v.equip) : [], pending: v.status !== 'done', rec: null };
    st.events.push(ev);

    else ev.rec = ocRec({ id: `방문-${ymd(vd).slice(2).replace(/-/g, '.')}-${pad(orphans.length + 1)}`, inflow: '현장', store: v.store, at: P(`${v.date} ${v.time || '00:00'}`) || vd, channel: guessChannel(v.equip),

  });
  // 4) 장비 조회 수기 기록
  (raw.remote && raw.remote.edits || []).forEach(e => {
    const st = ensure(e.branch, 'oc'); if (!st) return;
    if (e.k === 'e') st.events.push({ date: e.date, type: e.type || '기타', src: '수기', text: [e.name, e.model].filter(Boolean).join(' '), items: [{ type: e.item, name: e.name || e.item, qty: Number(e.qty) || 1, models: e.model ? [e.model] : [] }] });

  });

  RECS = RECS.concat(orphans).sort((a, b) => b.at - a.at);
  STORES.forEach(buildInventory);
  STORES.forEach(s => { s.isNew = !!s.installed && (TODAY - P(s.installed)) < 60 * 864e5 && P(s.installed) <= TODAY; });

}
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function mentionItems(text) {

}
// 장비 현황: 설치 수량 · 최근 교체 · 회수 · 최근 AS를 이력에서 계산하고, 수기 수정(o)을 덮어씁니다.
function buildInventory(s) {
  const inv = {};
  s.events.sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach(ev => {
    (ev.items || []).forEach(it => {
      const o = inv[it.type] = inv[it.type] || { type: it.type, name: it.name, qty: 0, models: [], first: '', replaced: '', removed: '', lastAs: '', n: 0 };
      o.n++;
      (it.models || []).forEach(m => { if (!o.models.includes(m)) o.models.push(m); });
      if (ev.pending) return;
      if (ev.type === '설치' && it.qty) { o.qty = it.existing ? o.qty || it.qty : it.qty; o.first = o.first || ev.date; o.removed = ''; }
      else if (ev.type === '교체') { o.replaced = ev.date; if (!o.qty) o.qty = it.qty || 1; }
      else if (ev.type === '회수') o.removed = ev.date;
      else if (ev.type === 'AS' || ev.type === '점검') o.lastAs = ev.date;
    });
  });
  (s.overrides || []).forEach(e => {
    const o = inv[e.type] = inv[e.type] || { type: e.type, name: (window.EquipParse && EquipParse.TYPE_MAP[e.type] || {}).name || e.type, qty: 0, models: [], first: '', replaced: '', removed: '', lastAs: '', n: 0 };
    if (e.qty !== undefined && e.qty !== '' && e.qty !== null) o.qty = Number(e.qty) || 0;
    if (e.model) o.models = [e.model];
    if (e.installed) o.first = e.installed;
    if (e.replaced) o.replaced = e.replaced;
    if (e.hidden) o.hidden = true;
    o.edited = true;
  });
  s.inv = Object.values(inv).filter(o => !o.hidden && (o.qty || o.first || o.replaced || o.edited));
  s.events.reverse();
}

/* ================================================================ 공통 조각 */
const src = k => k === 'oc' ? '<span class="src-tag src-oc">원격</span>' : k === 'both' ? '<span class="src-tag src-both">CS+원격</span>' : '<span class="src-tag src-cs">CS</span>';

const tile = (name, val, unit, sub, opt = {}) => `<div class="ov-tile ${opt.grand ? 'grand' : ''}" style="${opt.c ? '--c:' + opt.c : ''}"><div class="ov-name">${name}${opt.src ? `<span style="margin-left:auto">${opt.src}</span>` : ''}</div><div class="ov-val">${val}<small>${unit}</small></div><div class="ov-sub">${sub}</div></div>`;
const hbars = (rows, max) => rows.map(([k, v, extra]) => `<div class="hbar"><div class="nm" title="${esc(k)}">${esc(k)}</div><div class="tr"><div class="fl" style="width:${max ? v / max * 100 : 0}%"></div></div><div class="v"><b>${num(v)}</b>건${extra ? ' · ' + extra : ''}</div></div>`).join('');
const countBy = (arr, f) => { const m = {}; arr.forEach(x => { const k = f(x); if (k != null && k !== '') m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };

// 원격 대기: 상담 시각 → 원격 착수(슬랙 담당 확인 이모지 시각, 없으면 원격팀 접수 시각)

function stats(rows) {
  const done = rows.filter(r => r.status === '완료');
  return { total: rows.length, cs: rows.filter(r => r.src === 'cs').length, oc: rows.filter(r => r.src === 'oc').length, done: done.length, open: rows.length - done.length,
    mCs: rows.filter(r => r.method === 'CS안내').length, mRemote: rows.filter(r => r.method === '원격지원').length, mVisit: rows.filter(r => r.method === '방문점검').length,
    remoteAll: rows.filter(r => r.remote).length, linked: rows.filter(r => r.remote && r.remote.linked && r.src === 'cs').length,

function dailyChart(rows) {
  const m = {}; rows.forEach(r => { m[r.date] = (m[r.date] || 0) + 1; });
  const days = []; if (!rows.length) return '<div class="empty">기간 안에 상담이 없습니다.</div>';
  for (let d = startOfDay(rows[rows.length - 1].at); d <= rows[0].at; d = addDay(d, 1)) days.push(ymd(d));
  const W = 760, H = 220, L = 30, R = 8, T = 18, B = 26, iw = W - L - R, ih = H - T - B;
  const max = Math.max(4, ...days.map(d => m[d] || 0)), step = Math.ceil(max / 4), top = step * 4, bw = iw / days.length, gap = Math.max(2, bw * .22);
  const maxIdx = days.reduce((bi, d, i) => (m[d] || 0) > (m[days[bi]] || 0) ? i : bi, 0), every = Math.ceil(days.length / 8);

  days.forEach((d, i) => {
    const v = m[d] || 0, h = ih * v / top, x = L + i * bw + gap / 2, w = bw - gap, y = T + ih - h, r = Math.min(4, w / 2, h);
    const path = h > 0 ? `M${x},${T + ih}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${T + ih}Z` : '';
    g += `<g data-tip="<b>${v}건</b><br>${d.slice(5).replace('-', '/')} (${'일월화수목금토'[P(d).getDay()]})"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}"/>${path ? `<path class="bar" d="${path}"/>` : ''}</g>`;
    if (i === maxIdx && v) g += `<text class="lbl" x="${x + w / 2}" y="${y - 5}" text-anchor="middle">${v}</text>`;
    if (i % every === 0) g += `<text class="axis" x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${d.slice(5).replace('-', '/')}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일자별 처리 건수">${g}</svg></div>`;
}
function methodStack(s) {
  const t = s.mCs + s.mRemote + s.mVisit || 1, seg = (n, c, l) => n ? `<div style="flex:${n};background:var(${c})" data-tip="<b>${n}건</b> · ${l} ${(n / t * 100).toFixed(0)}%">${n / t > .09 ? (n / t * 100).toFixed(0) + '%' : ''}</div>` : '';

const storeName = k => (SM[k] || {}).name || k;

/* ================================================================ 검색 · 태그 · 펼치기 */
const squash = s => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
// 지점명: 띄어쓰기 · 브랜드명 · 기호를 무시하고 일부만 맞아도 찾습니다. 내용: 띄어 쓴 낱말이 모두 들어 있으면 찾습니다(띄어쓰기 무시).
function applyFilter(k, rows, o) {
  const f = flt(k), sq = skey(f.store), words = f.q.trim().split(/\s+/).filter(Boolean).map(squash);
  return rows.filter(r => {
    if (sq && !skey(o.store(r)).includes(sq)) return false;
    if (words.length) { const hay = squash(o.text(r)); if (!words.every(w => hay.includes(w))) return false; }
    return (o.tags || []).every(t => { const v = f.tags[t.key]; if (!v) return true; const got = t.get(r); return Array.isArray(got) ? got.includes(v) : got === v; });
  });
}
// 검색 줄: 지점명 · 내용 키워드 · 태그 드롭다운(값은 많은 순) · 조건 지우기 · 전체 닫기

    const opts = countBy(base.flatMap(r => [].concat(t.get(r) || [])), x => x).map(e => e[0]);

    return `<select data-tag="${t.key}" aria-label="${esc(t.label)}"><option value="">${esc(t.label)} 전체</option>${opts.map(v => `<option value="${esc(v)}" ${f.tags[t.key] === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
  };

const UPD_DEMO_KEY = 'ctd-updates-demo';
function updDemo() {

    { id: 'demo2', createdAt: '2026-10-30 15:20', updatedAt: '', author: 'yewon.lee', kind: '기능 업데이트', title: '키오스크 품절 일괄 처리 반영', body: 'VOC-261030-01 요청 건이 반영되었습니다. 관리자 화면 > 품절 관리에서 여러 메뉴를 한 번에 고를 수 있어요.', link: '', pinned: false }];
}
function updCall(fn, arg) {
  UPD_BUSY = true; UPD_ERR = ''; render();
  const done = text => { UPD_BUSY = false; const d = JSON.parse(text); UPD = d.items; UPD_EDIT = ''; UPD_DRAFT = null; UPD_DEL = ''; render(); };
  const fail = e => { UPD_BUSY = false; UPD_ERR = (e && e.message) || String(e); render(); };
  if (IS_GAS) { const run = google.script.run.withSuccessHandler(done).withFailureHandler(fail); return arg === undefined ? run[fn]() : run[fn](arg); }
  // 미리보기: 이 브라우저에만 저장
  try {
    let items = updDemo(); const now = dt(new Date());
    if (fn === 'saveDashboardUpdate') {
      if (!String(arg.title || '').trim()) throw new Error('제목을 적어 주세요.');
      const o = arg.id && items.find(x => x.id === arg.id);
      if (o) Object.assign(o, arg, { updatedAt: now }); else items.push(Object.assign({ author: '미리보기' }, arg, { id: 'd' + Date.now(), createdAt: now, updatedAt: '' }));
    }
    if (fn === 'deleteDashboardUpdate') items = items.filter(x => x.id !== arg);
    try { localStorage.setItem(UPD_DEMO_KEY, JSON.stringify(items)); } catch (e) {}
    setTimeout(() => done(JSON.stringify({ items })), 0);
  } catch (e) { setTimeout(() => fail(e), 0); }
}

function captureDraft() {
  const f = host.querySelector('.upd-form'); if (!f) return;
  UPD_DRAFT = { kind: f.querySelector('[name=kind]').value, title: f.querySelector('[name=title]').value, body: f.querySelector('[name=body]').value, link: f.querySelector('[name=link]').value, pinned: f.querySelector('[name=pinned]').checked };
}
function updForm(o) {
  const d = UPD_DRAFT || o || { kind: '공지', title: '', body: '', link: '', pinned: false };
  return `<div class="upd-form card" style="margin:0 0 14px;box-shadow:none;border:1px solid var(--yellow)"><div class="card-head" style="margin-bottom:10px"><h3>${o ? '글 고치기' : '새 글 쓰기'}</h3><span class="hint">휴대폰 번호는 저장할 때 자동으로 가려집니다</span></div>
    <div class="upd-grid"><label>분류<select name="kind">${UPD_KINDS.map(k => `<option ${d.kind === k ? 'selected' : ''}>${k}</option>`).join('')}</select></label>
      <label class="wide">제목<input name="title" maxlength="200" value="${esc(d.title)}" placeholder="예: 앱오더 플러그인 점검 안내"></label></div>
    <label>내용<textarea name="body" rows="7" placeholder="슬랙에 올린 내용을 붙여 넣어도 됩니다">${esc(d.body)}</textarea></label>
    <div class="upd-grid" style="grid-template-columns:minmax(0,1fr) auto"><label class="wide">링크 (선택)<input name="link" value="${esc(d.link)}" placeholder="슬랙 메시지 · 노션 주소 (https 로 시작)"></label><label class="chk-line"><input type="checkbox" name="pinned" ${d.pinned ? 'checked' : ''}> 상단 고정</label></div>
    <div class="controls" style="justify-content:flex-end;margin-top:6px"><button class="btn" data-upd-cancel>취소</button><button class="btn primary" data-upd-save="${esc(o ? o.id : '')}" ${UPD_BUSY ? 'disabled' : ''}>${UPD_BUSY ? '저장 중…' : '저장'}</button></div></div>`;
}
function viewUpdates() {
  if (!VIEWER.internal) return '<div class="notice"><span class="k">내부용</span><span class="t">업데이트는 회사 계정으로 로그인한 내부용 화면에서만 볼 수 있습니다.</span></div>';
  if (UPD === null) { if (!UPD_BUSY && !UPD_ERR) setTimeout(() => updCall('getDashboardUpdates'), 0); return UPD_ERR ? `<div class="notice danger"><span class="k">오류</span><span class="t">${esc(UPD_ERR)}</span></div>` : '<div class="loading">업데이트를 불러오는 중입니다…</div>'; }
  const tags = [{ key: 'kind', label: '분류', get: u => u.kind, order: UPD_KINDS }, { key: 'author', label: '작성자', get: u => u.author }];
  const rows = applyFilter('updates', UPD, { store: () => '', text: u => [u.title, u.body, u.kind, u.author].join(' '), tags })
    .sort((a, b) => (b.pinned - a.pinned) || String(b.createdAt).localeCompare(String(a.createdAt)));
  const p = paged('updates', rows, 20);
  let h = `<div class="notice"><span class="k">업데이트</span><span class="t">슬랙에 흩어져 있던 공지 · 기능 변경 · 운영 정책을 이 탭에 모읍니다. <b>[새 글 쓰기]</b>로 바로 올리고, 글을 펼쳐 <b>고치기 · 지우기</b>를 할 수 있습니다. ${IS_GAS ? '글은 업데이트 전용 시트에 저장됩니다.' : '<b>미리보기</b>에서는 이 브라우저에만 저장됩니다.'}</span></div>`;
  if (UPD_ERR) h += `<div class="notice danger"><span class="k">저장 실패</span><span class="t">${esc(UPD_ERR)}</span></div>`;
  h += `<div class="card"><div class="card-head"><h3>업데이트 ${num(UPD.length)}건</h3>${UPD_EDIT === 'new' ? '' : '<button class="btn primary" data-upd-new>＋ 새 글 쓰기</button>'}</div>${UPD_EDIT === 'new' ? updForm(null) : ''}${filterBar('updates', UPD, tags, rows.length, { noStore: true })}
    <div class="hc-list">${p.rows.map(u => { const key = `upd:${u.id}`, o = OPEN.has(key) || UPD_EDIT === u.id;
      return `<article class="hc-card ${o ? 'open' : ''}"><div class="hc-head" data-open="${esc(key)}" aria-expanded="${o}"><div><div class="hc-store">${u.pinned ? '📌 ' : ''}${esc(u.title)}</div><div class="hc-meta">${esc(u.createdAt)}${u.updatedAt ? ` · 고침 ${esc(u.updatedAt)}` : ''} · ${esc(u.author || '—')}</div></div><div class="hc-side"><span class="tag ${u.kind === '장애·이슈' ? 'red' : u.kind === '공지' ? 'warn' : ''}">${esc(u.kind)}</span><span class="caret">${o ? '접기 ▴' : '보기 ▾'}</span></div></div>`
        + (o ? `<div class="hc-body">${UPD_EDIT === u.id ? updForm(u) : `<div class="vp-t">${esc(u.body) || '<span class="muted">내용 없음</span>'}</div>${u.link ? `<a class="link" href="${esc(u.link)}" target="_blank" rel="noopener">관련 링크 열기 ↗</a>` : ''}
          <div class="controls" style="justify-content:flex-end"><button class="btn sm" data-upd-edit="${esc(u.id)}">고치기</button>${UPD_DEL === u.id ? `<button class="btn sm" data-upd-del-no>취소</button><button class="btn sm" style="background:var(--red);color:#fff;border-color:var(--red)" data-upd-del-yes="${esc(u.id)}">정말 지우기</button>` : `<button class="btn sm" data-upd-del="${esc(u.id)}">지우기</button>`}</div>`}</div>` : '') + `</article>`; }).join('') || empty(UPD.length ? '조건에 맞는 글이 없습니다.' : '아직 글이 없습니다. [새 글 쓰기]로 첫 글을 올려 보세요.')}</div>${pager('updates', p)}</div>`;
  return h;
}

/* ================================================================ 그리기 · 이벤트 */
function render() {
  if (!RAW) return;
  if (mode === 'share' && INTERNAL_VIEWS.includes(view)) view = 'overview';
  if (!scopes()[scope]) scope = '30d';
  if (!month || !months().includes(month)) month = months()[RECS.some(r => r.date.slice(0, 7) === ymd(TODAY).slice(0, 7)) && TODAY.getDate() > 7 ? 0 : 1] || months()[0] || ymd(TODAY).slice(0, 7);
  document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.v === view && !b.classList.contains('parent')));
  document.querySelectorAll('.view-tab.parent').forEach(b => b.classList.toggle('in', b.dataset.v === 'records' ? ['records', 'issues'].includes(view) : ['principles', 'incident', 'happycall'].includes(view)));
  const t = TITLES[view];
  document.title = `${t[0]} · 컴포즈 통합 대시보드`;
  document.getElementById('pgSub').innerHTML = `<b>${t[0]}</b> · ${t[1]}${GUIDE_VIEWS.includes(view) || view === 'updates' ? '' : ' · ' + (view === 'report' ? ymLabel(month) : ['equip', 'happy', 'issues'].includes(view) ? '전체 기간' : scopes()[scope])}`;
  document.getElementById('ctlHost').innerHTML = view === 'report'
    ? `<select id="monthSel">${months().map(m => `<option value="${m}" ${m === month ? 'selected' : ''}>${ymLabel(m)}</option>`).join('')}</select><button class="btn" id="printBtn">🖨 인쇄 · PDF</button>`
    : ['overview', 'records', 'stores'].includes(view) ? `<div class="seg" id="scopeSeg">${Object.entries(scopes()).map(([k, l]) => `<button data-s="${k}" class="${scope === k ? 'on' : ''}">${l}</button>`).join('')}</div>` : '';
  const errs = (RAW.errors || []).length ? `<div class="notice danger"><span class="k">확인 필요</span><span class="t">${RAW.errors.map(esc).join('<br>')}</span></div>` : '';
  if (GUIDE_VIEWS.includes(view)) { document.getElementById('viewHost').innerHTML = viewGuide(); afterGuide(); return; }
  if (view === 'updates') { captureDraft(); document.getElementById('viewHost').innerHTML = viewUpdates(); return; }
  document.getElementById('viewHost').innerHTML = errs + { overview: viewOverview, records: viewRecords, stores: viewStores, equip: viewEquip, happy: viewHappy, issues: viewIssues, report: viewReport }[view]();
}
function showData(raw) {
  buildModel(raw);
  document.getElementById('dataBadge').textContent = raw.demo ? '가상 데이터 미리보기' : `실데이터 · ${raw.now.slice(5)} 기준`;
  document.getElementById('csTime').textContent = raw.demo ? '가상' : `${raw.now.slice(5)} 읽음`;
  const u = raw.remote && raw.remote.updatedAt || {};
  document.getElementById('ocTime').textContent = raw.demo ? '가상' : u.as ? `${String(u.as).slice(5)} 갱신` : '—';
  render();
}
function load(fresh, silent) {
  if (STATIC) {
    if (!silent && !RAW) document.getElementById('viewHost').innerHTML = '<div class="loading">불러오는 중입니다…</div>';
    fetch(`${STATIC.dataUrl}?t=${Date.now()}`, { cache: 'no-store' })
      .then(res => { if (!res.ok) throw new Error(`데이터를 받지 못했습니다(HTTP ${res.status})`); return res.json(); })
      .then(showData).catch(e => { if (!silent) showError(e); });
    return;
  }
  if (!IS_GAS) { showData(demoRaw()); return; }
  if (!silent) document.getElementById('viewHost').innerHTML = '<div class="loading">CS 리포트와 원격팀 기록을 불러오는 중입니다…</div>';
  // 자동 새로고침은 화면을 비우지 않고, 실패해도 지금 화면을 그대로 둡니다.
  google.script.run.withSuccessHandler(text => { try { showData(JSON.parse(text)); } catch (e) { if (!silent) showError(e); } }).withFailureHandler(e => { if (!silent) showError(e); }).getIntegratedData(!!fresh, !VIEWER.internal);
}
function showError(e) { document.getElementById('pgTitle').textContent = '불러오지 못했습니다'; document.getElementById('viewHost').innerHTML = `<div class="notice danger"><span class="k">오류</span><span class="t">${esc(e && e.message || e)}</span></div>`; }

const host = document.getElementById('viewHost');
document.querySelectorAll('.view-tab').forEach(b => b.addEventListener('click', () => { document.body.classList.remove('side-open'); syncSide(); view = b.dataset.v; render(); window.scrollTo(0, 0); }));
document.getElementById('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; document.body.classList.toggle('share', mode === 'share'); document.querySelectorAll('#modeSeg button').forEach(x => { x.classList.toggle('on', x === b); x.classList.toggle('share', x === b && mode === 'share'); }); render(); });
document.getElementById('ctlHost').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) { scope = b.dataset.s; Object.keys(PG).forEach(k => { PG[k] = 1; }); render(); } if (e.target.closest('#printBtn')) window.print(); });
document.getElementById('ctlHost').addEventListener('change', e => { if (e.target.id === 'monthSel') { month = e.target.value; render(); } });
document.getElementById('refreshBtn').addEventListener('click', () => load(true));
host.addEventListener('click', e => {
  if (e.target.closest('[data-closeall]')) { OPEN.clear(); render(); return; }
  const rs = e.target.closest('[data-freset]'); if (rs) { const k = rs.closest('[data-fk]').dataset.fk; F[k] = { store: '', q: '', tags: {} }; PG[k] = 1; render(); return; }
  const ht = e.target.closest('[data-hct]'); if (ht) { hcType = ht.dataset.hct; render(); return; }
  // 업데이트: 새 글 · 고치기 · 저장 · 취소 · 지우기(한 번 더 확인)
  if (e.target.closest('[data-upd-new]')) { UPD_EDIT = 'new'; UPD_DRAFT = null; UPD_ERR = ''; render(); return; }
  const ue = e.target.closest('[data-upd-edit]'); if (ue) { UPD_EDIT = ue.dataset.updEdit; UPD_DRAFT = null; UPD_ERR = ''; render(); return; }
  if (e.target.closest('[data-upd-cancel]')) { UPD_EDIT = ''; UPD_DRAFT = null; UPD_ERR = ''; render(); return; }
  const us = e.target.closest('[data-upd-save]'); if (us) { captureDraft(); if (UPD_BUSY) return; updCall('saveDashboardUpdate', Object.assign({ id: us.dataset.updSave }, UPD_DRAFT)); return; }
  const ud = e.target.closest('[data-upd-del]'); if (ud) { UPD_DEL = ud.dataset.updDel; render(); return; }
  if (e.target.closest('[data-upd-del-no]')) { UPD_DEL = ''; render(); return; }
  const uy = e.target.closest('[data-upd-del-yes]'); if (uy) { updCall('deleteDashboardUpdate', uy.dataset.updDelYes); return; }
  const cp = e.target.closest('.g-copy'); if (cp) { const t = cp.previousElementSibling ? cp.previousElementSibling.innerText : ''; const done = () => { cp.textContent = '복사됨 ✓'; setTimeout(() => { cp.textContent = '문자 복사'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => {}); return; }
  if (e.target.closest('a, input, select, textarea')) return;
  // 상세 펼치기 · 접기: 탭은 그대로 두고 그 자리 아래로 펼칩니다.
  const op = e.target.closest('[data-open]'); if (op) { const k = op.dataset.open; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); render(); return; }
  const pg = e.target.closest('[data-page]'); if (pg && !pg.disabled) { PG[pg.dataset.pk] = +pg.dataset.page; render(); return; }
  const iv = e.target.closest('[data-iv]'); if (iv) { ivMode = iv.dataset.iv; render(); }
});
let qTimer;
host.addEventListener('input', e => {
  const inp = e.target.closest('[data-f]'); if (!inp) return;
  const k = inp.closest('[data-fk]').dataset.fk, f = inp.dataset.f;
  clearTimeout(qTimer); qTimer = setTimeout(() => { flt(k)[f] = inp.value; PG[k] = 1; render(); const n = host.querySelector(`[data-fk="${k}"] [data-f="${f}"]`); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 220);
});
host.addEventListener('change', e => { const sel = e.target.closest('[data-tag]'); if (!sel) return; const k = sel.closest('[data-fk]').dataset.fk; flt(k).tags[sel.dataset.tag] = sel.value; PG[k] = 1; render(); });
// 왼쪽 메뉴: 위쪽 [☰ 메뉴]로 열고 닫고(넓은 화면에서는 기억함), 메뉴 안 [«]로 닫습니다. 휴대폰에서는 화면 위로 열립니다.
const saved = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const narrow = () => matchMedia('(max-width:820px)').matches;
const sideOpen = () => narrow() ? document.body.classList.contains('side-open') : !document.body.classList.contains('side-off');
const syncSide = () => document.getElementById('sideToggle').setAttribute('aria-expanded', String(sideOpen()));
const setSide = open => { if (narrow()) document.body.classList.toggle('side-open', open); else { document.body.classList.toggle('side-off', !open); save('ctd-side', open ? 'on' : 'off'); } syncSide(); };
if (saved('ctd-side') === 'off') document.body.classList.add('side-off');
document.getElementById('sideToggle').addEventListener('click', () => setSide(!sideOpen()));
document.getElementById('sideClose').addEventListener('click', () => setSide(false));
document.getElementById('sideDim').addEventListener('click', () => setSide(false));
document.querySelectorAll('.grp').forEach(g => {
  if (saved(`ctd-grp-${g.dataset.g}`) === 'closed') g.classList.add('closed');
  g.addEventListener('click', () => save(`ctd-grp-${g.dataset.g}`, g.classList.toggle('closed') ? 'closed' : 'open'));
});
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => { const g = e.target.closest && e.target.closest('[data-tip]'); document.querySelectorAll('.chart g.on').forEach(x => x !== g && x.classList.remove('on')); if (!g) { tip.style.opacity = 0; return; } if (g.tagName === 'g') g.classList.add('on'); tip.innerHTML = g.dataset.tip; tip.style.opacity = 1; tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 14) + 'px'; tip.style.top = (e.clientY - 44) + 'px'; });
const themeBtn = document.getElementById('themeBtn');
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const syncTheme = () => { themeBtn.textContent = isDark() ? '☀️' : '🌙'; themeBtn.title = isDark() ? '라이트 모드' : '다크 모드'; };
themeBtn.addEventListener('click', () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('ctd-theme', document.documentElement.dataset.theme); } catch (e) {} syncTheme(); });
try { const t = localStorage.getItem('ctd-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
/* 주소 끝 해시로 화면을 바로 엽니다: #equip, #report, #records&open, #overview&share&dark */
{ const hs = decodeURIComponent(location.hash.slice(1)).split('&');
  if (TITLES[hs[0]]) view = hs[0];
  if (hs.includes('dark')) document.documentElement.dataset.theme = 'dark';
  syncTheme(); syncSide();
  if (!VIEWER.internal) {
    // 회사 계정이 아니면 공유용 고정: 보기 전환을 숨기고, 내부 주소가 있으면 '회사 계정으로 보기' 링크를 둡니다.
    mode = 'share'; document.body.classList.add('share');
    document.getElementById('modeSeg').outerHTML = VIEWER.internalUrl ? `<a class="btn" href="${esc(VIEWER.internalUrl)}" target="_top">회사 계정으로 보기</a>` : '';
    if (INTERNAL_VIEWS.includes(view)) view = 'overview';
  }
  // 서버가 페이지에 데이터를 실어 보냈으면(미리 계산된 캐시) 추가 요청 없이 바로 그리고, 없으면 불러옵니다.
  if (typeof DATA_SLOT === 'object' && DATA_SLOT) showData(DATA_SLOT); else load(false);
  if (IS_GAS || STATIC) setInterval(() => { if (!document.hidden) load(false, true); }, AUTO_REFRESH_MINUTES * 60000);
  if (hs.includes('share') && document.querySelector('#modeSeg [data-m="share"]')) document.querySelector('#modeSeg [data-m="share"]').click();
  if (hs.includes('open') && RAW) { const r = RECS.find(x => x.remote && x.remote.linked && x.visit && !x.visit.pending); if (r) { OPEN.add(`rec:${r.id}`); flt('records').q = r.id; scope = r.at >= addDay(TODAY, -30) ? '30d' : 'm' + r.date.slice(0, 7); if (!scopes()[scope]) scope = '30d'; render(); } } }
</script>
